<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — Second Mind</title>
    <link rel="icon" href="icons&logo/svg/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons&logo/png/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons&logo/png/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#221B14" />
    <style>
      @import url("icons&logo/tokens.css");

      html,
      body {
        height: 100%;
      }

      a {
        transition: color 150ms ease-out;
      }

      :focus-visible {
        outline: 2px solid var(--sm-clay);
        outline-offset: 2px;
        border-radius: var(--sm-radius-sm);
      }

      /* layout */

      .auth-layout {
        min-height: 100vh;
        display: flex;
      }

      .auth-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--sm-space-7) var(--sm-space-5);
        background: var(--sm-paper);
      }

      .auth-form-wrap {
        width: 100%;
        max-width: 400px;
      }

      /* brand */

      .brand {
        display: flex;
        align-items: center;
        gap: var(--sm-space-3);
        margin-bottom: var(--sm-space-6);
      }

      .brand img {
        display: block;
      }

      .brand .sm-wordmark {
        font-size: 19px;
      }

      /* heading */

      .card-head {
        display: flex;
        flex-direction: column;
        gap: var(--sm-space-2);
        margin-bottom: var(--sm-space-6);
      }

      .card-head .sm-eyebrow {
        margin-bottom: var(--sm-space-1);
      }

      .card-head h1 {
        margin: 0;
        font-size: var(--sm-fs-h2);
        font-weight: 700;
        letter-spacing: var(--sm-lsp-heading);
      }

      .card-head p {
        margin: 0;
      }

      /* form */

      .form {
        display: flex;
        flex-direction: column;
        gap: var(--sm-space-4);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: var(--sm-space-2);
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .label {
        font-size: var(--sm-fs-small);
        font-weight: 600;
        color: var(--sm-ink);
      }

      .link-sm {
        font-size: var(--sm-fs-small);
        font-weight: 600;
      }

      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon {
        position: absolute;
        left: 12px;
        display: flex;
        color: var(--sm-ink-45);
        pointer-events: none;
        transition: color 150ms ease-out;
      }

      .input-icon svg {
        width: 18px;
        height: 18px;
      }

      .input-wrap:has(.input:focus) .input-icon {
        color: var(--sm-clay);
      }

      .input {
        width: 100%;
        height: 44px;
        padding: 0 var(--sm-space-3) 0 40px;
        background: var(--sm-surface);
        border: 1px solid var(--sm-line);
        border-radius: var(--sm-radius-sm);
        color: var(--sm-ink);
        font-family: var(--sm-font);
        font-size: var(--sm-fs-body);
        transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
      }

      .input::placeholder {
        color: var(--sm-ink-45);
      }

      .input:focus-visible {
        border-color: var(--sm-clay);
        outline: none;
        box-shadow: 0 0 0 3px var(--sm-clay-tint);
      }

      .input-toggle {
        position: absolute;
        right: 6px;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        border-radius: var(--sm-radius-sm);
        color: var(--sm-ink-45);
        cursor: pointer;
        transition: background 150ms ease-out, color 150ms ease-out;
      }

      .input-toggle svg {
        width: 18px;
        height: 18px;
      }

      .input-toggle:hover {
        background: var(--sm-paper);
        color: var(--sm-ink-70);
      }

      /* buttons */

      .sm-btn--block {
        width: 100%;
        justify-content: center;
      }

      .sm-btn svg {
        width: 16px;
        height: 16px;
        transition: transform 0.18s ease;
      }

      .sm-btn:hover svg {
        transform: translateX(3px);
      }

      /* footer bits */

      .switch {
        margin: var(--sm-space-6) 0 0;
        font-size: var(--sm-fs-body);
        color: var(--sm-ink-70);
      }

      .switch a {
        font-weight: 600;
      }

      .footnote {
        margin: var(--sm-space-8) 0 0;
        font-size: 12px;
        color: var(--sm-ink-45);
      }

      @media (max-width: 420px) {
        .card-head h1 {
          font-size: var(--sm-fs-h3);
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-layout">
      <main class="auth-main">
        <div class="auth-form-wrap">
          <a class="brand" href="index.html">
            <img src="icons&logo/svg/mark.svg" width="32" height="32" alt="Second Mind" />
            <span class="sm-wordmark"><span>Second</span><b>Mind</b></span>
          </a>

          <div class="card-head">
            <span class="sm-eyebrow">Selamat datang kembali</span>
            <h1>Masuk ke akun kamu</h1>
            <p>Lanjutkan bikin mindmap dari dokumenmu.</p>
          </div>

          <form class="form" onsubmit="event.preventDefault(); window.location.href = 'composer.html';">
            <div class="field">
              <label class="label" for="email">Email</label>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                    <path d="m22 6-10 7L2 6" />
                  </svg>
                </span>
                <input class="input" type="email" id="email" name="email" placeholder="kamu@email.com" autocomplete="email" required />
              </div>
            </div>

            <div class="field">
              <div class="field-head">
                <label class="label" for="password">Password</label>
                <a class="link-sm" href="#">Lupa password?</a>
              </div>
              <div class="input-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                </span>
                <input class="input" type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required />
                <button type="button" class="input-toggle" aria-label="Tampilkan password" onclick="togglePassword(this)">
                  <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="icon-eye-off" style="display: none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68" />
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61" />
                    <line x1="2" y1="2" x2="22" y2="22" />
                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="sm-btn sm-btn--primary sm-btn--block">
              Masuk
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
            </button>
          </form>

          <p class="switch">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
          <p class="footnote">© 2026 Second Mind</p>
        </div>
      </main>
    </div>

    <script>
      function togglePassword(button) {
        var wrap = button.closest(".input-wrap");
        var input = wrap.querySelector("input");
        var isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        button.querySelector(".icon-eye").style.display = isHidden ? "none" : "block";
        button.querySelector(".icon-eye-off").style.display = isHidden ? "block" : "none";
        button.setAttribute("aria-label", isHidden ? "Sembunyikan password" : "Tampilkan password");
      }
    </script>
  </body>
</html>
